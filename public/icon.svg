<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070F1B"/>
      <stop offset="50%" stop-color="#0B1525"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCEEAC"/>
      <stop offset="50%" stop-color="#D6B56E"/>
      <stop offset="100%" stop-color="#936D26"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAF1FD"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <!-- Shield Outer -->
  <path d="M60 6 L108 22 V64 C108 92 86 110 60 116 C34 110 12 92 12 64 V22 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner Rim -->
  <path d="M60 14 L100 28 V62 C100 86 80 102 60 108 C40 102 20 86 20 62 V28 Z" fill="none" stroke="rgba(122,219,240,0.3)" stroke-width="1.5"/>
  <!-- Football Pattern in Center -->
  <circle cx="60" cy="54" r="22" fill="#0A1828" stroke="url(#cyanGrad)" stroke-width="2.5"/>
  <path d="M60 38 L68 45 L65 55 L55 55 L52 45 Z" fill="#7ADBF0" opacity="0.9"/>
  <path d="M60 38 V32 M68 45 L74 42 M65 55 L70 61 M55 55 L50 61 M52 45 L46 42" stroke="#7ADBF0" stroke-width="2" stroke-linecap="round"/>
  <!-- Star on top -->
  <polygon points="60,18 62,23 68,23 63,27 65,32 60,29 55,32 57,27 52,23 58,23" fill="url(#goldGrad)"/>
  <!-- Club Name Banner -->
  <rect x="22" y="80" width="76" height="18" rx="4" fill="#0B1525" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="60" y="93" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" letter-spacing="1.5" fill="#FCEEAC">DODAEONA FC</text>
</svg>
