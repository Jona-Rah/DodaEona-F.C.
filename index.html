    <!-- Pre-render theme initialization script & HMR error filter -->
    <script>
      (function() {
        // Suppress expected HMR WebSocket errors in AI Studio iframe environment (HMR is disabled by design)
        var _origConsoleError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (
            typeof first === 'string' &&
            (first.indexOf('[vite]') !== -1 ||
             first.indexOf('WebSocket') !== -1 ||
             first.indexOf('vite-hmr') !== -1)
          ) {
            return;
          }
          if (arguments[1] && typeof arguments[1].message === 'string' && arguments[1].message.indexOf('WebSocket') !== -1) {
            return;
          }
          return _origConsoleError.apply(console, arguments);
        };

        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (
              protoStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('vite-hmr') !== -1 ||
              urlStr.indexOf('@vite') !== -1
            ) {
              var stub = new EventTarget();
              stub.readyState = 1; // WebSocket.OPEN
              stub.url = urlStr;
              stub.protocol = 'vite-hmr';
              stub.send = function() {};
              stub.close = function() {};
              return stub;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            typeof event.reason.message === 'string' &&
            event.reason.message.includes('WebSocket')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          if (
            event &&
            (
              (typeof event.message === 'string' && event.message.includes('WebSocket')) ||
              (typeof event.filename === 'string' && event.filename.includes('@vite/client'))
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        try {
          var saved = localStorage.getItem('dodaeona_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
